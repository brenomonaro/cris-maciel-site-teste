# Publica o site no GitHub Pages e atualiza os imóveis do C2S a cada 30 minutos.
# O token do C2S fica no segredo do repositório (Settings > Secrets and variables > Actions):
#   C2S_IMOB_TOKEN. Sem ele, o site sai com os imóveis de exemplo.
# Os últimos imóveis que deram certo ficam guardados no ramo "dados". Se o C2S falhar, o site usa esses.
# Em Settings > Pages, "Source" precisa estar em "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar os imóveis no C2S
        env:
          C2S_IMOB_TOKEN: ${{ secrets.C2S_IMOB_TOKEN }}
        run: node scripts/c2s.mjs _dados

      - name: Guardar os imóveis novos ou usar os últimos que deram certo
        run: |
          if [ -f _dados/imoveis.json ]; then
            cd _dados
            git init -q -b dados
            git add -A
            git -c user.name="Site Cris Maciel" -c user.email="site@users.noreply.github.com" commit -qm "Imóveis do C2S"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
            rm -rf .git
            cd ..
          elif git fetch -q origin dados 2>/dev/null && git show origin/dados:imoveis.json 2>/dev/null | grep -q '"fonte":"C2S"'; then
            mkdir -p _dados
            git archive origin/dados | tar -x -C _dados
            echo "Usando os últimos imóveis do C2S guardados."
          else
            echo "Ainda não há imóveis do C2S guardados: o site sai com os exemplos."
          fi

      - name: Gerar a página própria de cada imóvel
        env:
          SITE_URL: https://brenomonaro.github.io/cris-maciel-site-teste
        run: |
          mkdir -p _dados
          node scripts/paginas.mjs _dados

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html 404.html lx-media robots.txt og-image.png .nojekyll _site/
          if [ -d _dados ]; then cp -r _dados/. _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
