<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecionando · Cris Maciel</title>
<script>
/* Endereços do site antigo (Kenlo) levados para o site novo.
   No GitHub Pages não existe redirecionamento 301 de verdade: esta página faz o papel dele para quem chega pelo navegador.
   Num servidor com redirecionamento (Cloudflare Pages ou Netlify), vale o arquivo _redirects. */
(function(){
  var p = location.pathname, base = '/';
  if (/\.github\.io$/.test(location.hostname)) { var s = p.split('/')[1]; if (s) { base = '/' + s + '/'; p = p.slice(base.length - 1); } }
  var paginas = {'/quem-somos':'historia','/fale-conosco':'contato','/politica-de-privacidade':'privacidade','/cadastre-seu-imovel':'proprietario',
    '/faca-parte':'trabalhe','/corretores':'equipe','/financiamento-e-bancos':'processo','/cadastro-de-proposta':'contato','/avalie-seu-corretor':'contato'};
  var lanc = {'vettia-residence':'vettia','viva-parque-aura':'aura'};
  var q = '', m, limpo = p.replace(/\/+$/, '');
  if (paginas[limpo]) q = '?p=' + paginas[limpo];
  else if ((m = /^\/imovel\/[^\/]+\/([A-Za-z0-9]+)-ENZS$/.exec(limpo))) q = '?imovel=' + m[1];
  else if (/^\/imoveis\/para-alugar/.test(limpo)) q = '?fin=locacao';
  else if (/^\/imoveis\/novos/.test(limpo)) q = '?p=lancamentos';
  else if (/^\/imoveis\//.test(limpo)) q = '?p=imoveis';
  else if ((m = /^\/empreendimento\/([^\/]+)/.exec(limpo))) { q = '?p=lancamentos'; for (var k in lanc) if (m[1].indexOf(k) === 0) q = '?emp=' + lanc[k]; }
  else q = '?p=nao-encontrado';
  location.replace(base + q);
})();
</script>
